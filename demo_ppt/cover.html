<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Video Album · Empty Templates</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #003057;
  --navy-deep: #0A1E36;
  --gold: #B3A369;
  --gold-bright: #EAAA00;
  --cream: #F4EEDD;
  --cream-soft: #FBF7EC;
  --paper: #FFFFFF;
  --ink: #16243A;
  --ink-soft: #4A5670;
  --rule: #D9CFB4;
  --ghost: #B6AC8C;
  --font-display: "Newsreader", Georgia, serif;
  --font-sans: "Geist", "Helvetica Neue", Arial, sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: transparent; font-family: var(--font-sans); }

section[data-slide] {
  width: 1920px;
  height: 1080px;
  position: relative;
  overflow: hidden;
  background: var(--cream-soft);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 28px;
}

/* === Brand chrome (constant across all 4 templates) === */
.dot-bg {
  position: absolute; inset: 0;
  background-image: radial-gradient(circle, rgba(179, 163, 105, 0.22) 1.2px, transparent 1.4px);
  background-size: 14px 14px;
  pointer-events: none;
}
.gold-curve {
  position: absolute; inset: 60px;
  border: 3px solid var(--gold);
  border-radius: 90px;
  pointer-events: none;
}
.gold-curve.thin { border-width: 1.5px; opacity: 0.55; }
.corner-shape {
  position: absolute;
  top: -40px; left: -40px;
  width: 280px; height: 220px;
  background: var(--navy);
  clip-path: polygon(0 0, 100% 0, 80% 100%, 0 100%);
}
.corner-shape.gold {
  top: auto; bottom: 80px; left: -20px;
  width: 160px; height: 110px;
  background: transparent;
  border: 3px solid var(--gold-bright);
  clip-path: polygon(15% 0, 100% 0, 85% 100%, 0 100%);
}

/* GT logo bottom-right — replicates the pptx mark */
.gt-mark {
  position: absolute;
  right: 60px; bottom: 50px;
  display: flex; align-items: center; gap: 14px;
}
.gt-mark .gt-logo {
  width: 64px; height: 64px;
  border: 3px solid var(--navy);
  border-radius: 4px;
  display: grid; place-items: center;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 38px;
  color: var(--gold);
  background: var(--paper);
}
.gt-mark .stack {
  display: flex; flex-direction: column;
  line-height: 1.05;
  font-size: 22px;
  color: var(--navy);
  font-family: var(--font-display);
  font-weight: 700;
}
.gt-mark .stack sub { font-size: 14px; }

/* Template badge top-right (also serves as a placeholder for "EP.0X · series name") */
.tpl-badge {
  position: absolute;
  top: 50px; right: 90px;
  font-family: var(--font-sans);
  font-size: 16px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--ink-soft);
  font-weight: 500;
}
.tpl-badge b { color: var(--navy); }
.tpl-badge .num { color: var(--gold); font-weight: 600; }

/* Mascot frame */
.mascot {
  border-radius: 50%;
  overflow: hidden;
  border: 6px solid var(--gold);
  background: var(--navy);
  position: relative;
  box-shadow: 0 12px 40px rgba(0,48,87,0.18), inset 0 0 0 2px var(--paper);
}
.mascot::after {
  content: "";
  position: absolute; inset: -22px;
  border: 1.5px dashed var(--gold);
  border-radius: 50%;
  pointer-events: none;
}
.mascot img { width: 100%; height: 100%; object-fit: cover; display: block; }

/* === Placeholder system — empty slots with whisper labels === */
.slot {
  border: 1.5px dashed var(--ghost);
  border-radius: 14px;
  background: rgba(255,255,255,0.35);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--ghost);
  font-family: var(--font-sans);
  font-size: 16px;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  font-weight: 500;
  position: relative;
}
.slot.text-slot {
  border: none;
  background: transparent;
  justify-content: flex-start;
  font-family: var(--font-display);
  font-style: italic;
  color: var(--ghost);
  letter-spacing: -0.005em;
  text-transform: none;
  font-weight: 500;
}
.slot.title-slot   { font-size: 120px; line-height: 0.98; }
.slot.subtitle-slot{ font-size: 36px;  line-height: 1.25; }
.slot.heading-slot { font-size: 64px;  line-height: 1.05; }
.slot.row-slot     { font-size: 38px;  line-height: 1.4; }
.slot.body-slot    { font-size: 26px;  line-height: 1.5; align-items: flex-start; padding-top: 8px; }

.slot .tag {
  position: absolute;
  top: 10px; left: 14px;
  font-size: 11px;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--gold);
  background: var(--paper);
  padding: 2px 8px;
  border-radius: 4px;
  border: 1px solid var(--rule);
  font-family: var(--font-sans);
  font-style: normal;
  font-weight: 600;
}

/* TOC row placeholder */
.toc-row-slot {
  display: grid;
  grid-template-columns: 100px 1fr 160px;
  align-items: center;
  gap: 32px;
  padding: 26px 0;
  border-bottom: 1px solid var(--rule);
}
.toc-row-slot .n {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 56px;
  color: var(--gold);
  font-variant-numeric: tabular-nums;
}
.toc-row-slot .t {
  height: 28px;
  border-radius: 6px;
  background: repeating-linear-gradient(90deg, var(--rule) 0 60%, transparent 60% 100%);
  background-size: 28px 28px;
  opacity: 0.55;
}
.toc-row-slot .ts {
  height: 22px;
  background: var(--rule);
  border-radius: 4px;
  opacity: 0.45;
}

/* Footer template number strip */
.slide-foot {
  position: absolute;
  bottom: 50px; left: 90px;
  display: flex; align-items: center; gap: 18px;
  font-size: 16px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-soft);
}
.slide-foot .num {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 22px;
  color: var(--navy);
}
.slide-foot .bar { width: 60px; height: 1px; background: var(--gold); }

</style>
</head>
<body>
<section data-slide data-screen-label="01 Cover">
  <div class="dot-bg"></div>
  <div class="corner-shape"></div>
  <div class="corner-shape gold"></div>
  <div class="gold-curve"></div>

  <!-- Title block (left) -->
  <div style="position: absolute; left: 130px; top: 240px; width: 1000px; display: flex; flex-direction: column; gap: 28px;">
    <div class="slot" style="width: 280px; height: 46px; font-size: 13px;">EYEBROW · SEASON</div>
    <div class="slot text-slot title-slot" style="height: 380px; align-items: flex-start;">Title</div>
    <div class="slot text-slot subtitle-slot" style="height: 110px; align-items: flex-start;">Subtitle / one-line description</div>
    <div style="display: flex; gap: 14px; margin-top: 8px;">
      <div class="slot" style="width: 220px; height: 50px; border-radius: 999px;">CHIP</div>
      <div class="slot" style="width: 220px; height: 50px; border-radius: 999px;">CHIP</div>
      <div class="slot" style="width: 220px; height: 50px; border-radius: 999px;">CHIP</div>
    </div>
  </div>

  <!-- Mascot (right, large) -->
  <div style="position: absolute; right: 180px; top: 290px;">
    <div class="mascot" style="width: 460px; height: 460px; border-width: 8px;">
      <img src="../image/mascot.png" alt="">
    </div>
    <div class="slot" style="margin: 36px auto 0; width: 320px; height: 56px;">HOST / SHOW NAME</div>
  </div>
</section>
</body>
</html>
